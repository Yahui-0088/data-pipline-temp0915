<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Galaxy · 数据星球</title>
<link rel="stylesheet" href="/static/galaxy/galaxy.css?v={{ static_v('galaxy/galaxy.css') }}">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="gx-canvas" aria-hidden="true"></div>

<header class="gx-tl">
  <div class="gx-title">DATA GALAXY</div>
  <div class="gx-sub">Interactive Dataset Explorer · 数据星球</div>
  <ul class="gx-hints" aria-label="操作说明">
    <li><span aria-hidden="true">⟳</span>拖动旋转 · 滚轮缩放</li>
    <li><i class="gx-sw ok"></i>鼠标滑过光点：绿 = 已处理，灰 = 未处理</li>
  </ul>
  <div class="gx-badge todo" id="gx-mock" hidden title="没连上平台的汇报接口，显示的是示例数据">示例数据</div>
</header>

<section class="gx-tr gx-glass" aria-label="数据集统计">
  <div><span class="gx-k"><i class="gx-sw ok"></i>已处理</span><b id="gx-processed">–</b></div>
  <div><span class="gx-k"><i class="gx-sw todo"></i>未处理</span><b id="gx-unprocessed">–</b></div>
  <div><span class="gx-k">完成率</span><b id="gx-completion">–</b></div>
  <div class="gx-links">
    <a href="/report/summary">汇报详情 →</a>
    {% if user and user.role != 'reporter' %}<a href="/overview">回到平台</a>{% endif %}
    {% if user %}<button type="button" id="gx-logout">退出</button>{% endif %}
  </div>
  <div class="gx-note" id="gx-overflow"></div>
</section>

<section class="gx-dock gx-glass" aria-label="视角">
  <div class="gx-btns">
    <button type="button" id="gx-auto" aria-pressed="true" title="空闲时缓慢自转">自转</button>
    <button type="button" id="gx-reset" title="重置视角（R）">重置</button>
    <button type="button" id="gx-fs" title="全屏（F）">全屏</button>
  </div>
</section>

<div id="gx-info" class="gx-glass" role="status" hidden></div>
<div id="gx-empty" class="gx-center gx-glass" hidden><b>还没有可展示的数据集</b><p>这个账号能看的项目里还没有登记数据集。</p></div>
<div id="gx-fatal" class="gx-overlay" hidden><div class="gx-card gx-glass"><div class="gx-title">DATA GALAXY</div><p></p><a href="/report/summary">打开汇报详情 →</a></div></div>
<noscript><div class="gx-overlay"><div class="gx-card gx-glass"><p>需要开启 JavaScript。</p><a href="/report/summary">打开汇报详情 →</a></div></div></noscript>

{% if user %}<script>document.getElementById("gx-logout").addEventListener("click", async () => { try { await fetch("/api/v1/auth/logout", {method: "POST"}); } catch (_) {} location.href = "/login"; });</script>{% endif %}
<script type="module" src="/static/galaxy/app.js?v={{ static_v('galaxy/app.js') }}"></script>
</body>
</html>
