<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Galaxy · 数据星球</title>
<link rel="stylesheet" href="/static/galaxy/galaxy.css?v={{ static_v('galaxy/galaxy.css') }}">
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"{% for m in ["cameraRig", "config", "datasetManager", "particleSculpture", "scene", "shapes", "ui"] %},
    "/static/galaxy/{{ m }}.js": "/static/galaxy/{{ m }}.js?v={{ static_v('galaxy/' ~ m ~ '.js') }}"{% endfor %}
} }
</script>
</head>
<body>
<div id="gx-canvas" aria-hidden="true"></div>

<header class="gx-tl">
  <div class="gx-title">DATA GALAXY</div>
  <div class="gx-sub">Interactive Dataset Explorer · 数据星球</div>
  <div class="gx-badge todo" id="gx-mock" hidden title="没连上平台的汇报接口，显示的是示例数据">示例数据</div>
</header>

{% if not (user and user.role == 'reporter') %}
<div class="gx-side" id="gx-side">
<button type="button" class="gx-sidetab" id="gx-sidetab" aria-label="展开导航" aria-expanded="false" aria-controls="gx-nav"></button>
<nav class="gx-nav gx-glass" id="gx-nav" aria-label="平台导航">
  <div class="gx-nav-brand"><span class="gx-nav-logo">EM</span><b>EM Image QC</b></div>
  <a class="gx-nav-item" href="/overview"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="1"/><rect x="13" y="3" width="8" height="6" rx="1"/><rect x="3" y="15" width="8" height="6" rx="1"/><rect x="13" y="11" width="8" height="10" rx="1"/></svg>总览<span aria-hidden="true">→</span></a>
</nav>
</div>
{% endif %}

<div class="gx-pull" id="gx-pull">
<button type="button" class="gx-tab" id="gx-tab" aria-label="展开数据集统计" aria-expanded="false" aria-controls="gx-stats"></button>
<section class="gx-tr gx-glass" id="gx-stats" aria-label="数据集统计">
  <div><span class="gx-k"><i class="gx-sw ok"></i>已处理</span><b id="gx-processed">–</b></div>
  <div><span class="gx-k"><i class="gx-sw todo"></i>未处理</span><b id="gx-unprocessed">–</b></div>
  <div><span class="gx-k">完成率</span><b id="gx-completion">–</b></div>
  <div class="gx-note" id="gx-overflow"></div>
</section>
</div>


<div id="gx-info" class="gx-glass" role="status" hidden></div>
<div id="gx-empty" class="gx-center gx-glass" hidden><b>还没有可展示的数据集</b><p>这个账号能看的项目里还没有登记数据集。</p></div>
<div id="gx-fatal" class="gx-overlay" hidden><div class="gx-card gx-glass"><div class="gx-title">DATA GALAXY</div><p></p><a href="/report/summary">打开汇报详情 →</a></div></div>
<noscript><div class="gx-overlay"><div class="gx-card gx-glass"><p>需要开启 JavaScript。</p><a href="/report/summary">打开汇报详情 →</a></div></div></noscript>

<script src="/static/gx-transition.js?v={{ static_v('gx-transition.js') }}"></script>
<script type="module" src="/static/galaxy/app.js?v={{ static_v('galaxy/app.js') }}"></script>
</body>
</html>
